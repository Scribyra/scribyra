[package]
name = "scribyra-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
sha2 = "0.10"
sha1 = "0.10"
regex = "1.13"
synctex-parser = { path = "../../vendor/synctex-parser", features = ["memory-only"] }
flate2 = "1.1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
tar = { version = "0.4.46", default-features = false }
# Review insertion ranks must retain their exact ordering through JSON validation.
serde_json = { version = "1", features = ["float_roundtrip"] }
diffy = { version = "=0.5.2", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1", features = ["v4"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"

[dev-dependencies]
serde_json = "1"

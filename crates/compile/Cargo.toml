[package]
name = "scribyra-compile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandboxed TeX runner for server compiles: native TeX Live or the browser's WebAssembly engine (bubblewrap, seccomp, rlimits, cgroups)"

[dependencies]
libc = "0.2"
# The WebAssembly engine's package cache: the pinned catalog, checksums and the mirror.
scribyra-core = { path = "../core" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

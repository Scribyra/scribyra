[package]
name = "scribyra-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kubernetes operator for Scribyra organisation deployments"

[dependencies]
scribyra-sync = { path = "../sync" }
kube = { version = "5.1", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.29", features = ["v1_33", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus-client = "0.24"
axum = "0.8"
semver = "1"
thiserror = "2"
getrandom = "0.4"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
tempfile = "3"
http = "1"

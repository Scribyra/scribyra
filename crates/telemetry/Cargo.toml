[package]
name = "scribyra-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scribyra-core = { path = "../core" }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
sha2 = "0.10"
subtle = "2.6"
url = "2"
prost = "0.14"
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs", "with-serde"] }

[dev-dependencies]
tempfile = "3"

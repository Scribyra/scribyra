[package]
name = "scribyra-assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1.1"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
tar = { version = "0.4.46", default-features = false }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
ttf-parser = "0.25.1"
scribyra-core = { path = "../core" }

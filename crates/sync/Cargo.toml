[package]
name = "scribyra-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# Only for the one-time `migrate-sqlite` import of milestone-S data directories.
rusqlite = { version = "0.32", features = ["bundled"] }
# Runtime-checked queries only (no compile-time macros, no DATABASE_URL at build);
# `macros` is needed for the embedded `migrate!` migrator.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
rusty-s3 = { version = "0.11", default-features = false, features = ["rustcrypto"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
async-trait = "0.1"
bytes = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
subtle = "2"
getrandom = "0.4"
scribyra-core = { path = "../core" }
tower-http = { version = "0.7", features = ["cors"] }
# OIDC single sign-on: ID-token signature checks (RS256, ES256, EdDSA) written in `sso/jose.rs`.
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit", "sha2"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = "2"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
# Server-readable projects: validating updates, snapshots and materialisation.
yrs = "0.25"

[dev-dependencies]
tempfile = "3"
# The `test-idp` example signs tokens with PEM test keys.
rsa = { version = "0.9.10", features = ["pem"] }
p256 = { version = "0.13.2", features = ["pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
hmac = "0.12"

[[example]]
name = "plaintext-demo"
test = true

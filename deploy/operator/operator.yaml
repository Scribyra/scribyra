apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: scribyra-operator
    app.kubernetes.io/part-of: scribyra
  name: scribyra-operator
  namespace: scribyra-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scribyra-operator
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scribyra-operator
        app.kubernetes.io/part-of: scribyra
    spec:
      containers:
      - args:
        - run
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SCRIBYRA_OPERATOR_IMAGE
          value: ghcr.io/scribyra/scribyra-operator:0.1.0
        - name: SCRIBYRA_OPERATOR_REGISTRY
          value: ghcr.io/scribyra
        - name: RUST_LOG
          value: info
        image: ghcr.io/scribyra/scribyra-operator:0.1.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 10
        name: operator
        ports:
        - containerPort: 8080
          name: metrics
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 5
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: scribyra-operator
---
apiVersion: v1
kind: Service
metadata:
  labels:

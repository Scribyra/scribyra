                    minimum: 0.0
                    nullable: true
                    type: integer
                  memberBytes:
                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                  projectBytes:
                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
              replicas:
                default: 2
                description: |-
                  API replicas when `autoscaling` is not set. Server-readable deployments (whose blobs are
                  always in S3 here) run several; an end-to-end deployment, whose API takes the database
                  exclusively, always runs one (see `docs/operator.md`).
                format: int32
                maximum: 100.0
                minimum: 1.0
                type: integer
              resources:
                description: Resources for API pods.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              storage:
                properties:
                  provisioned:
                    nullable: true
                    properties:
                      size:
                        default: 50Gi
                        description: Volume size of the single-node Garage store, for example `50Gi`.
                        maxLength: 32
                        minLength: 1
                        type: string
                      storageClassName:
                        maxLength: 253
                        nullable: true
                        type: string
                    type: object
                  s3:
                    nullable: true
                    properties:
                      bucket:
                        description: An existing bucket; the service never creates or lists buckets.
                        maxLength: 63
                        minLength: 3
                        type: string
                      cidrs:
                        description: |-
                          CIDRs the endpoint is reached at, for the egress NetworkPolicy. Empty allows 443 to any
                          address.
                        items:
                          maxLength: 64
                          type: string
                        maxItems: 32
                        type: array
                      endpoint:
                        description: '`https://` endpoint, for example `https://s3.eu-west-1.amazonaws.com`.'
                        maxLength: 512
                        minLength: 9
                        pattern: ^https://[^?#@\s]+$
                        type: string
                      pathStyle:
                        default: false
                        description: Path-style URLs (Garage, MinIO, IP endpoints).
                        type: boolean
                      region:
                        default: auto
                        maxLength: 64
                        minLength: 1
                        type: string
                      secretRef:
                        description: Secret with keys `access-key-id` and `secret-access-key` (names overridable).
                        properties:
                          accessKeyIdKey:
                            default: access-key-id
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                          secretAccessKeyKey:
                            default: secret-access-key
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - bucket
                    - endpoint
                    - secretRef
                    type: object
                type: object
                x-kubernetes-validations:
                - message: storage needs exactly one of s3 and provisioned
                  rule: has(self.s3) != has(self.provisioned)
                - message: storage cannot switch between s3 and provisioned (that would start from an empty bucket)
                  rule: has(self.s3) == has(oldSelf.s3)
              version:
                description: |-
                  Scribyra release to run (the image tag). Changing it starts an orchestrated upgrade:
                  the migration Job runs to completion before the Deployments roll. Downgrades and
                  upgrades that skip a required release are refused (`UpgradeBlocked`).
                maxLength: 64
                minLength: 1
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
                type: string
            required:
            - domain
            - ingress
            - oidc
            - postgres
            - storage
            - version
            type: object
            x-kubernetes-validations:
            - message: 'server compile needs encryption: serverReadable (the server cannot compile what it cannot read)'
              rule: self.compile.mode == 'browser' || self.encryption == 'serverReadable'
            - message: backup is for provisioned PostgreSQL (CloudNativePG); back up an external database with its own tooling
              rule: '!has(self.backup) || has(self.postgres.provisioned)'
            - message: autoscaling.maxReplicas must be at least minReplicas
              rule: '!has(self.autoscaling) || self.autoscaling.maxReplicas >= self.autoscaling.minReplicas'
            - message: 'policy.guests must be off with encryption: endToEnd'
              rule: self.encryption == 'serverReadable' || !has(self.policy) || !has(self.policy.guests) || self.policy.guests == 'off'
          status:
            description: Status written by the operator.
            nullable: true
            properties:
              compileWorkers:
                nullable: true
                properties:
                  desiredReplicas:
                    format: int32
                    type: integer
                  lastBusy:
                    description: When the queue last had work (RFC 3339), for scale-down stabilisation.
                    nullable: true
                    type: string
                  queueLength:
                    format: int64
                    nullable: true
                    type: integer
                required:
                - desiredReplicas
                type: object
              conditions:
                description: '`Ready`, `Progressing`, `Degraded`, `UpgradeBlocked`, `DatabaseReady`, `StorageReady`.'
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      maxLength: 1024
                      type: string
                    status:
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              masterKeySecret:
                description: The Secret holding the master key; back it up separately from the database.
                nullable: true
                type: string
              migratedVersion:
                description: The release whose migration Job completed last.
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              storageBootstrapped:
                description: Whether the provisioned Garage store has its layout, key and bucket.
                nullable: true
                type: boolean
              url:
                nullable: true
                type: string
              version:
                description: The release the Deployments run.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Scribyra
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 40 characters (it prefixes every generated object)
          rule: self.metadata.name.size() <= 40
    served: true
    storage: true
    subresources:
      status: {}

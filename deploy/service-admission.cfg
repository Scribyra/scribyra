# TCP admission before nginx allocates a TLS handshake. Run in the foreground:
# haproxy -db -f /absolute/path/to/service-admission.cfg
# Keep nginx's PROXY-protocol listener private to this process.
global
    maxconn 256
    nbthread 1

defaults
    mode tcp
    timeout connect 2s
    timeout client 125s
    timeout server 125s

frontend admission
    bind 127.0.0.1:8443
    maxconn 128
    stick-table type ip size 4096 expire 10s nopurge store conn_cur,conn_rate(1s)
    tcp-request connection track-sc0 src
    # Fail closed when the bounded source table is full; never evict active sources.
    tcp-request connection reject unless { sc0_tracked }
    tcp-request connection reject if { sc0_conn_cur gt 16 }
    tcp-request connection reject if { sc0_conn_rate gt 32 }
    default_backend tls

backend tls
    server nginx 127.0.0.1:9443 send-proxy-v2

# Run with: nginx -p /absolute/path/to/install/ -c nginx.conf -g 'daemon off;'
# Place tls.crt and tls.key in that prefix; keep the service on loopback.
# REQUIRED: service-admission.cfg is the external listener. Never expose this port.
worker_processes 1;
pid nginx.pid;
error_log /dev/null;
events {
    worker_connections 256;
}
http {
    access_log off;
    server_tokens off;
    client_body_temp_path body;
    proxy_temp_path proxy;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    client_max_body_size 8m;
    keepalive_timeout 5s;
    send_timeout 5s;
    reset_timedout_connection on;

    limit_conn_zone $binary_remote_addr zone=per_ip:1m;
    limit_conn_zone $server_name zone=total:1m;
    limit_req_zone $binary_remote_addr zone=requests:1m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=health_requests:1m rate=20r/s;
    limit_conn_status 429;
    limit_req_status 429;
    map $http_upgrade $connection_upgrade {
        default close;
        websocket upgrade;
    }

    server {
        listen 127.0.0.1:9443 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        server_name localhost;
        ssl_certificate tls.crt;
        ssl_certificate_key tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_tickets off;
        limit_conn per_ip 16;
        limit_conn total 64;
        limit_req zone=requests burst=20 nodelay;

        location = /health {
            limit_req zone=health_requests burst=20 nodelay;
            proxy_pass http://127.0.0.1:8787;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        location / {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 125s;
        }
    }
}

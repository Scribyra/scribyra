<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peer field test</title>
<style>body{font:15px system-ui;max-width:760px;margin:20px auto;padding:0 12px;color:#222;background:#fff}textarea{width:100%;height:96px;font:12px monospace}button{margin:4px 6px 4px 0;padding:6px 12px}pre{background:#f3f3f3;padding:8px;white-space:pre-wrap;word-break:break-all;font-size:12px}section{border-top:1px solid #ccc;padding:8px 0}@media(prefers-color-scheme:dark){body{background:#181818;color:#eee}pre{background:#2a2a2a}}</style>
<h1>Peer field test</h1><p>Throwaway test. It sends random bytes only, stores nothing, and uses no server unless you tick STUN. Do not put real documents here.</p>
<section><label><input type=checkbox id=stun> Also try public STUN (sends your IP address to Google)</label><br><button id=cam>Grant camera first (optional)</button><span id=camout></span></section>
<section><h2>Laptop A</h2><button id=mk>1. Create invite</button><textarea id=off readonly aria-label="Invite to copy to laptop B"></textarea><label>3. Paste reply from B<textarea id=ansin aria-label="Reply from B"></textarea></label><button id=acc>Connect</button></section>
<section><h2>Laptop B</h2><label>2. Paste invite from A<textarea id=offin aria-label="Invite from A"></textarea></label><button id=rep>Create reply</button><textarea id=ans readonly aria-label="Reply to copy to laptop A"></textarea></section>
<section><h2>Fallback if status stays "new" or fails</h2><label>On A, type B's Wi-Fi IPv4 address <input id=ip placeholder="192.168.1.23"></label> <button id=typed>Try typed address</button></section>
<section><h2>Result</h2><button id=bulk>Send 20 MiB test</button><button id=copy>Copy result</button><pre id=st role=status>idle</pre></section>
<script>
const $=i=>document.getElementById(i);const R={started:new Date().toISOString(),ua:navigator.userAgent,origin:location.origin||location.protocol,secure:isSecureContext,events:[],camera:false};let pc,dc,t0;
const log=(k,v)=>{R.events.push([Math.round(performance.now()),k,v]);render();};const render=()=>{$('st').textContent=JSON.stringify(R,null,1);};
const cfg=()=>({iceServers:$('stun').checked?[{urls:'stun:stun.l.google.com:19302'}]:[]});
function wire(){pc.onconnectionstatechange=()=>log('conn',pc.connectionState);pc.oniceconnectionstatechange=()=>log('ice',pc.iceConnectionState);}
function chan(c){dc=c;dc.binaryType='arraybuffer';dc.bufferedAmountLowThreshold=262144;dc.onopen=async()=>{R.connectedMs=Math.round(performance.now()-t0);log('channel','open');await pairInfo();};dc.onclose=()=>log('channel','closed');let rx=0,start=0;dc.onmessage=e=>{if(typeof e.data==='string'){const m=JSON.parse(e.data);if(m.ping)dc.send(JSON.stringify({pong:m.ping}));else if(m.pong){(R.rtt=R.rtt||[]).push(Math.round(performance.now()-m.pong));render();}else if(m.bulkDone){R.bulkRx={bytes:rx,ms:Math.round(performance.now()-start),mbps:+(rx*8/(performance.now()-start)/1000).toFixed(1)};dc.send(JSON.stringify({bulkAck:R.bulkRx}));render();}else if(m.bulkAck){R.bulk=m.bulkAck;render();}}else{if(!start)start=performance.now();rx+=e.data.byteLength;}};}
const pairInfo=async()=>{const s=await pc.getStats();const m=new Map();s.forEach(x=>m.set(x.id,x));s.forEach(x=>{if(x.type==='candidate-pair'&&(x.nominated||x.selected)&&x.state==='succeeded'){const l=m.get(x.localCandidateId),r=m.get(x.remoteCandidateId);R.path={local:l?.candidateType,remote:r?.candidateType,protocol:l?.protocol};}if(x.type==='transport')R.dtls=x.tlsVersion+' '+x.dtlsCipher;});R.maxMessage=pc.sctp?.maxMessageSize;for(let i=0;i<5;i++)dc.send(JSON.stringify({ping:performance.now()}));render();};
const gather=()=>new Promise(res=>{const to=setTimeout(res,8000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(to);res();}});});
const cands=sdp=>sdp.split(/\r?\n/).filter(l=>l.startsWith('a=candidate')).map(l=>{const p=l.split(' ');return p[2].toLowerCase()+' '+p[7]+' '+(p[4].endsWith('.local')?'mdns':p[4])+' '+p[5];});
$('cam').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:true});window.__s=s;R.camera=true;$('camout').textContent=' granted';render();}catch(e){$('camout').textContent=' '+e.name;}};
$('mk').onclick=async()=>{R.role='A';t0=performance.now();pc=new RTCPeerConnection(cfg());wire();chan(pc.createDataChannel('t'));await pc.setLocalDescription(await pc.createOffer());await gather();$('off').value=btoa(JSON.stringify(pc.localDescription));R.localCandidates=cands(pc.localDescription.sdp);R.inviteChars=$('off').value.length;render();};
$('rep').onclick=async()=>{R.role='B';t0=performance.now();pc=new RTCPeerConnection(cfg());wire();pc.ondatachannel=e=>chan(e.channel);await pc.setRemoteDescription(JSON.parse(atob($('offin').value.trim())));await pc.setLocalDescription(await pc.createAnswer());await gather();$('ans').value=btoa(JSON.stringify(pc.localDescription));R.localCandidates=cands(pc.localDescription.sdp);R.remoteCandidates=cands(pc.remoteDescription.sdp);render();};
let answerPort;$('acc').onclick=async()=>{t0=performance.now();const d=JSON.parse(atob($('ansin').value.trim()));R.remoteCandidates=cands(d.sdp);answerPort=(R.remoteCandidates.find(c=>c.startsWith('udp'))||'').split(' ')[3];await pc.setRemoteDescription(d);log('applied','answer');};
$('typed').onclick=async()=>{R.typedFallback=true;await pc.addIceCandidate({candidate:`candidate:9 1 udp 2122260223 ${$('ip').value.trim()} ${answerPort} typ host`,sdpMid:'0'});log('typed',$('ip').value.trim());};
$('bulk').onclick=async()=>{const n=20*1048576,c=16384,b=new Uint8Array(c);crypto.getRandomValues(b);for(let o=0;o<n;o+=c){if(dc.bufferedAmount>1048576)await new Promise(r=>{dc.onbufferedamountlow=r;});dc.send(b);}dc.send(JSON.stringify({bulkDone:1}));log('bulk','sent');};
$('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(R));render();
</script></html>

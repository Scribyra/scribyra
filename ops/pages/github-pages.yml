# Installed once, by a maintainer, as .github/workflows/pages.yml in the presentation
# repository (scribyra/scribyra-site, custom domain scribyra.com); see
# docs/github-move.md. The main repository's production workflow pushes the deployed
# release as public/ with a deploy key; this publishes it unchanged. CI never writes
# this file.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write # publish this repository's Pages site
      id-token: write # OIDC token that actions/deploy-pages presents to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the site
        run: |
          test -s public/index.html && test -s public/sw.js && test -s public/app/sw.js
          test -s public/domain-router.js && test -s public/release.json
          grep -Eq '"release": "web-[1-9][0-9]*"' public/release.json
          ! grep -q '^Disallow: /$' public/robots.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

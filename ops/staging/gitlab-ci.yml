# Written by scribyra's deploy-staging job (scripts/deploy-staging.mjs); do not edit
# here. This project only publishes the staging site that the main project built:
# https://dev.scribyra.com/ (noindex, telemetry-free, marked Staging).
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  tags: [scribyra-nix]
  resource_group: staging-pages
  interruptible: true
  variables:
    GIT_DEPTH: '1'
  script:
    - test -s public/index.html && test -s public/sw.js && test -s public/app/sw.js && test -s public/release.json
    # Quoted: an unquoted ": " would make YAML read this line as a mapping.
    - "grep -q 'Disallow: /' public/robots.txt"
  pages:
    publish: public
    expire_in: never

[server]
http_addr = 127.0.0.1
http_port = ${SCRIBYRA_GRAFANA_PORT}
[paths]
data = ${SCRIBYRA_STATE}/grafana/data
logs = ${SCRIBYRA_STATE}/grafana/logs
plugins = ${SCRIBYRA_STATE}/grafana/plugins
provisioning = ${SCRIBYRA_GRAFANA_PROVISIONING}
[security]
admin_user = operator
admin_password = $__file{${SCRIBYRA_STATE}/grafana-admin.password}
disable_gravatar = true
[database]
wal = true
[auth.anonymous]
enabled = false
[auth.basic]
enabled = true
[users]
allow_sign_up = false
allow_org_create = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
preinstall_disabled = true
[smtp]
enabled = false
[log]
mode = console
level = warn
[unified_alerting]
enabled = true
min_interval = 10s

services:
  postgres:
    # Pinned by version tag. Before first use, record its digest with
    # `docker image inspect --format '{{index .RepoDigests 0}}' postgres:17.6-bookworm`,
    # compare it with the digest published on the official image page, and then replace the
    # tag below with `postgres:17.6-bookworm@sha256:<digest>`.
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: scribyra
      POSTGRES_DB: scribyra
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scribyra", "-d", "scribyra"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published: only the sync service reaches it on the compose network.
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
  sync:
    # Built locally with nix build .#service-image, pinned by flake.lock/Cargo.lock.
    image: scribyra-sync:0.2.0-pg1
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SCRIBYRA_SERVICE_CONFIG: /config/service.json
      # The URL contains the password: it is read from a secret file, never from service.json.
      # File contents: postgres://scribyra:<password>@postgres:5432/scribyra
      SCRIBYRA_SERVICE_DATABASE_URL_FILE: /run/secrets/database-url
    secrets: [database-url]
    volumes:
      # Filesystem blobs. For S3 blobs this volume is unused (see below).
      - sync-data:/data
      - ./service.json:/config/service.json:ro
    init: true
    read_only: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Optional S3-compatible blobs (AWS S3, Cloudflare R2, Garage or MinIO behind HTTPS).
    # Plain http:// is accepted only for loopback endpoints, so a Garage container on this
    # network needs a TLS proxy in front of it. Add to `environment` and `secrets`:
    #   SCRIBYRA_SERVICE_BLOB_STORE: s3
    #   SCRIBYRA_SERVICE_S3_ENDPOINT: https://<account>.r2.cloudflarestorage.com
    #   SCRIBYRA_SERVICE_S3_REGION: auto
    #   SCRIBYRA_SERVICE_S3_BUCKET: scribyra
    #   SCRIBYRA_SERVICE_S3_ACCESS_KEY_ID: <access key id>
    #   SCRIBYRA_SERVICE_S3_PATH_STYLE: "false"
    #   SCRIBYRA_SERVICE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3-secret
    # secrets: [database-url, s3-secret]
secrets:
  postgres-password:
    file: ./secrets/postgres-password
  database-url:
    file: ./secrets/database-url
  # s3-secret:
  #   file: ./secrets/s3-secret
volumes:
  sync-data:
  postgres-data:

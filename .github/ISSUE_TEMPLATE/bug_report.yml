name: Bug report
description: Something in Scribyra does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please don't attach a private project:
        a small example that shows the problem is best. For security problems, email
        contact@scribyra.com instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://app.scribyra.com/
        2. Start with a sample paper
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 159, Chromium 156
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, ChromeOS, Android, iOS / iPadOS, Other]
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release
      description: The app address you used and, if you know it, the release (shown at /release.json, e.g. web-1012). Self-hosted? Give the commit.
      placeholder: https://app.scribyra.com/ (web-1012)
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics export or compile log
      description: |
        Optional but very helpful. In the app open Diagnostics (projects sidebar, or More tools → Diagnostics),
        turn on the local timeline, reproduce the problem, export the JSON and attach it here.
        For compile problems, paste the relevant part of the compilation log. Check exports before attaching.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screenshots, a minimal .tex example, or how often it happens.

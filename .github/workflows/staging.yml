# Push to dev → the suite, then the staging site at https://dev.scribyra.com/.
# The site is pushed as public/ to the staging repository (scribyra-staging), whose
# own Pages workflow publishes it (ops/staging/github-pages.yml). Run by hand on dev
# to redeploy.
name: staging
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    concurrency:
      group: staging-plan
      cancel-in-progress: true
    timeout-minutes: 5
    permissions: {}
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - id: plan
        env:
          BASE: ${{ vars.SCRIBYRA_RELEASE_BASE }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/dev ] || { echo "::error::Staging deploys dev only"; exit 1; }
          [[ "$BASE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::Set the repository variable SCRIBYRA_RELEASE_BASE (docs/github-move.md)"; exit 1; }
          echo "release=dev-$((BASE + RUN_NUMBER))-${SHA:0:8}" >> "$GITHUB_OUTPUT"

  suite:
    name: suite
    needs: plan
    # A newer push to dev supersedes a running suite; a deploy is never cancelled.
    concurrency:
      group: staging-suite
      cancel-in-progress: true
    uses: ./.github/workflows/suite.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ and a local reusable workflow is read from the caller's commit
    permissions:
      contents: read
    with:
      staging-release: ${{ needs.plan.outputs.release }}
      save-caches: true

  deploy:
    name: deploy dev.scribyra.com
    needs: [plan, suite]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: staging
      url: https://dev.scribyra.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-site
          path: .cache/staging-artifact
      - name: Unpack
        run: |
          mkdir -p .cache/staging/site
          tar -xf .cache/staging-artifact/artifact.tar -C .cache/staging/site
          rm -rf .cache/staging-artifact
          node scripts/staging-pages.mjs check .cache/staging
      - name: Push to the staging repository
        env:
          SCRIBYRA_PAGES_FORGE: github
          SCRIBYRA_STAGING_DEPLOY_KEY: ${{ secrets.SCRIBYRA_STAGING_DEPLOY_KEY }}
          SCRIBYRA_STAGING_REPOSITORY: git@github.com:${{ github.repository_owner }}/scribyra-staging.git
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/deploy-staging.mjs .cache/staging
